<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeatherGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />


  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/purify.min.js') }}"></script>
</head>

<body data-user-id="{{ user_id }}">

  <div class="app">

    <!-- ============ LEFT SECTION ============ -->
    <aside class="rail" id="rail">
      <div class="rail-top">
        <div class="brand">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5" />
            <line x1="24" y1="6" x2="24" y2="12" stroke="currentColor" stroke-width="2.5" />
            <line x1="24" y1="36" x2="24" y2="42" stroke="currentColor" stroke-width="2.5" />
            <circle cx="24" cy="24" r="3.5" fill="currentColor" />
            <line x1="24" y1="24" x2="32" y2="18" stroke="currentColor" stroke-width="2.5" />
          </svg>
          <span>WeatherGPT</span>
        </div>
        <button class="btn-new" id="btn-new-chat">
          <svg viewBox="0 0 20 20" width="14" height="14">
            <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          New conversation
        </button>
      </div>

      <nav class="rail-section" aria-label="Projects">
        <div class="rail-label">Projects</div>
        <ul class="rail-list">
          <li class="rail-item rail-item--muted">No projects yet</li>
        </ul>
      </nav>

      <nav class="rail-section rail-section--grow" aria-label="Conversations">
        <div class="rail-label">Conversations</div>
        <ul class="rail-list" id="conversation-list"></ul>
      </nav>

      <div class="rail-bottom">
        <button class="rail-user" id="btn-settings">
          <span class="avatar" id="user-avatar">?</span>
          <span class="rail-user-name" id="user-name">—</span>
          <svg viewBox="0 0 20 20" width="14" height="14" class="gear">
            <path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.5"
              fill="none" />
            <path
              d="M10 2.5v1.6M10 15.9v1.6M17.5 10h-1.6M4.1 10H2.5M15.4 4.6l-1.13 1.13M5.73 14.27L4.6 15.4M15.4 15.4l-1.13-1.13M5.73 5.73 4.6 4.6"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <form action="{{ url_for('logout') }}" method="post" class="logout-form">
          <button type="submit" class="btn-logout">Log out</button>
        </form>
      </div>
    </aside>

    <!-- ============ MIDDLE SECTION ============ -->
    <main class="convo">
      <header class="convo-header">
        <h1 id="convo-title">New conversation</h1>
        <button class="btn-toggle-viz" id="btn-toggle-viz" title="Show visualization panel" aria-pressed="false">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M2 8h16" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
            <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2" />
            <line x1="24" y1="6" x2="24" y2="12" stroke="currentColor" stroke-width="2" />
            <line x1="24" y1="36" x2="24" y2="42" stroke="currentColor" stroke-width="2" />
            <circle cx="24" cy="24" r="3.5" fill="currentColor" />
            <line x1="24" y1="24" x2="32" y2="18" stroke="currentColor" stroke-width="2" />
          </svg>
          <p>Ask about the weather anywhere — “What’s it like in Mumbai this weekend?”</p>
        </div>
      </div>

      <form class="composer" id="composer" action="/api/chat">
        <textarea name="message" id="composer-input" placeholder="Message WeatherGPT…" rows="1"
          autocomplete="off"></textarea>
        <button type="submit" id="composer-send" aria-label="Send message">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <path d="M3 10h14M11 4l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </main>

    <!-- ============ RIGHT SECTION ============ -->
    <aside class="viz" id="viz-panel">
      <div class="viz-inner">
        <header class="viz-header">
          <nav class="viz-tabs" aria-label="Visualization mode">
            <button class="viz-tab is-active" data-tab="visualization" type="button">Visualization</button>
            <button class="viz-tab" data-tab="map" type="button">Map</button>
          </nav>
          <button id="btn-clear-overlays" class="viz-tab-btn">🗑</button>
          <button class="viz-close" id="btn-close-viz" aria-label="Collapse panel">
            <svg viewBox="0 0 20 20" width="14" height="14">
              <path d="M13 4 7 10l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </header>

        <div class="viz-pane is-active" data-pane="visualization" id="pane-visualization">
          <div class="viz-empty" id="viz-empty">Charts the assistant renders will appear here.</div>
          <img id="viz-image" alt="Weather visualization" hidden />
        </div>

        <div class="viz-pane" data-pane="map" id="pane-map">
          <div id="viz-map-root"></div>
        </div>
      </div>
    </aside>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
